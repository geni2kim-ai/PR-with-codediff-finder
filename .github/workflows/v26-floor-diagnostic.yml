name: v2.6 Floor Diagnostic
on:
  push:
    branches: [review/v2.6-hardening-candidate]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Print floor diagnostics
        shell: bash
        run: |
          python - <<'PY'
          import json,subprocess,sys,tempfile
          from pathlib import Path
          sys.path.insert(0,'tools')
          from policy_engine import load_yaml,classify_paths,derive_required_level
          def run(args,cwd):
              return subprocess.run(args,cwd=cwd,text=True,check=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE).stdout.strip()
          with tempfile.TemporaryDirectory() as td:
              r=Path(td);run(['git','init','-q'],r);run(['git','config','user.email','t@example.com'],r);run(['git','config','user.name','t'],r)
              (r/'infra').mkdir();(r/'infra/main.tf').write_text('x=1\n');run(['git','add','-A'],r);run(['git','commit','-qm','base'],r);base=run(['git','rev-parse','HEAD'],r)
              (r/'infra/main.tf').write_text('x=2\n');run(['git','add','-A'],r);run(['git','commit','-qm','head'],r)
              ev=r/'ev.json';subprocess.run([sys.executable,'tools/textdiff_adapter.py','--repo',str(r),'--repository','owner/repo','--base',base,'--head','HEAD','--output',str(ev)],check=True)
              e=json.loads(ev.read_text());paths=[x['path'] for x in e['files']];cfg=load_yaml('policy/protected-paths.yml');hits=classify_paths(paths,cfg)
              print(json.dumps({'tool':e['tool'],'pins':load_yaml('policy/sensor-policy.yml')['trusted_tool']},sort_keys=True))
              model={'reversibility':'EASY','blast_radius':'LOCAL','data_sensitivity':'NONE','security_surface':'LOW','availability_criticality':'LOW'}
              direct=derive_required_level(model,hits,{},load_yaml('policy/escalation-policy.yml'),load_yaml('policy/sensor-policy.yml'))
              print(json.dumps({'paths':paths,'protected':e['summary']['protected_candidates'],'hits':hits,'direct':direct},sort_keys=True))
              out=r/'out';subprocess.run([sys.executable,'tools/run_review_cycle_v26b.py','--repo',str(r),'--evidence',str(ev),'--expected-base',base,'--case-id','DIAG','--output-dir',str(out),'--l1-cmd-json',json.dumps([sys.executable,'tools/mock_reviewer.py','--mode','pass']),'--l2-cmd-json',json.dumps([sys.executable,'tools/mock_reviewer.py','--mode','pass']),'--adversarial-cmd-json',json.dumps([sys.executable,'tools/mock_reviewer.py','--mode','pass']),'--disable-random-audit'],check=True)
              print((out/'review-cycle.json').read_text())
              if (out/'review-failure.json').is_file(): print((out/'review-failure.json').read_text())
          PY
