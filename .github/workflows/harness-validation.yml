name: Harness Full Validation

on:
  pull_request:
  push:
    branches:
      - hardening/v2.6
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harness-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate manifest candidate
        run: python tools/generate_manifest.py --git-ref HEAD --output MANIFEST.generated.sha256

      - name: Upload manifest candidate
        uses: actions/upload-artifact@v4
        with:
          name: manifest-candidate
          path: MANIFEST.generated.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Apply generated manifest for validation
        run: cp MANIFEST.generated.sha256 MANIFEST.sha256

      - name: Verify manifest against Git blobs
        run: python tools/verify_manifest.py --git-ref HEAD

      - name: Run canonical full validation
        run: python tools/run_validation.py --full --test-timeout 120

      - name: Commit validated manifest to hardening branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/hardening/v2.6'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANIFEST.sha256
          if git diff --cached --quiet; then
            echo "MANIFEST already current"
          else
            git commit -m "build: refresh v2.6 manifest"
            git push origin HEAD:hardening/v2.6
          fi
