name: Harness Full Validation

on:
  pull_request:
  push:
    branches:
      - hardening/v2.6
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify manifest against Git blobs
        run: python tools/verify_manifest.py --git-ref HEAD

      - name: Run canonical full validation
        run: python tools/run_validation.py --full --test-timeout 120
