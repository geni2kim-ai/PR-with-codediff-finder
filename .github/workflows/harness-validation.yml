name: Harness Full Validation

on:
  pull_request:
  push:
    branches:
      - hardening/v2.7
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate manifest candidate
        run: |
          python tools/generate_manifest.py --git-ref HEAD --output MANIFEST.generated.sha256
          echo "BEGIN_GENERATED_MANIFEST"
          cat MANIFEST.generated.sha256
          echo "END_GENERATED_MANIFEST"

      - name: Upload manifest candidate
        uses: actions/upload-artifact@v4
        with:
          name: manifest-candidate
          path: MANIFEST.generated.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Require committed manifest on PR/manual validation
        if: github.event_name != 'push' || github.ref != 'refs/heads/hardening/v2.7'
        shell: bash
        run: |
          if ! cmp -s MANIFEST.sha256 MANIFEST.generated.sha256; then
            echo "::error::Committed MANIFEST.sha256 is stale or incomplete."
            diff -u MANIFEST.sha256 MANIFEST.generated.sha256 || true
            exit 1
          fi
          python tools/verify_manifest.py --git-ref HEAD

      - name: Apply generated manifest for hardening-branch push validation
        if: github.event_name == 'push' && github.ref == 'refs/heads/hardening/v2.7'
        run: cp MANIFEST.generated.sha256 MANIFEST.sha256

      - name: Verify manifest against Git blobs
        run: python tools/verify_manifest.py --git-ref HEAD

      - name: Run canonical full validation
        run: python tools/run_validation.py --full --test-timeout 120

      - name: Build validated v2.7 source package
        run: git archive --format=zip --prefix=PR-with-codediff-finder-v2.7/ -o PR-with-codediff-finder-v2.7.zip HEAD

      - name: Upload validated v2.7 source package
        uses: actions/upload-artifact@v4
        with:
          name: v2.7-source-package
          path: PR-with-codediff-finder-v2.7.zip
          if-no-files-found: error
          retention-days: 7
