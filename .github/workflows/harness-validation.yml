name: Harness Full Validation

on:
  pull_request:
  push:
    branches:
      - hardening/v2.6
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify manifest
        shell: python
        run: |
          import hashlib
          from pathlib import Path

          root = Path(".")
          errors = []
          for raw in (root / "MANIFEST.sha256").read_text(encoding="utf-8").splitlines():
              if not raw.strip():
                  continue
              expected, rel = raw.split("  ", 1)
              path = root / rel.removeprefix("./")
              if not path.is_file():
                  errors.append(f"missing: {rel}")
                  continue
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected:
                  errors.append(f"hash mismatch: {rel}")
          if errors:
              raise SystemExit("\n".join(errors))
          print("MANIFEST: PASS")

      - name: Run canonical full validation
        run: python tools/run_validation.py --full --test-timeout 120
