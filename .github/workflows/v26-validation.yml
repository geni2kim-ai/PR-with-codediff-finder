name: v2.6 Harness Validation

on:
  push:
    branches:
      - review/v2.6-hardening-candidate
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run v2.6 hardening regressions
        run: python -m unittest -q tests.test_v26_hardening
      - name: Run existing full validation
        run: python tools/run_validation.py --full
