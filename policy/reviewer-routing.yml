schema_version: '2.4'
mode: shadow
reviewers:
  L1:
    node_id: L1-local
    model:
      family: configured-local-reviewer
      version: unconfigured
    prompt_ref: profiles/harness/reviewer-worker-core.md
    skill_ref: null
    fresh_model_session_attested: false
  L2:
    node_id: L2-local
    model:
      family: configured-local-reviewer
      version: unconfigured
    prompt_ref: profiles/harness/reviewer-worker-core.md
    skill_ref: null
    fresh_model_session_attested: false
  ADVERSARIAL:
    node_id: adversarial-external
    model:
      family: configured-independent-reviewer
      version: unconfigured
    prompt_ref: profiles/harness/reviewer-worker-core.md
    skill_ref: null
    fresh_model_session_attested: false
runtime:
  timeout_seconds: 180
  max_output_bytes: 1048576
  max_stderr_bytes: 262144
  environment_allowlist:
  - PATH
  - PYTHONPATH
  - VIRTUAL_ENV
  - SYSTEMROOT
  - WINDIR
  - TEMP
  - TMP
  - HOME
  - USERPROFILE
  shell: false
  required_attestation_fields:
  - environment_secret_stripping
  - network_denied
  - filesystem_scoped_to_workspace
  attestation_max_age_seconds: 300
  attestation_max_future_skew_seconds: 5
  ledger_hmac_required_in_enforced: true
  audit_seed_required_in_enforced: true
