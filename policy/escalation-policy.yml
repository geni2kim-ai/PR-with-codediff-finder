schema_version: '2.7'
levels:
- L1
- L2
- ADVERSARIAL
- HUMAN
finding_triage:
  note_only_severities:
  - minor
  - nit
  agent_review_severities:
  - major
  - blocker
  force_agent_review_failure_families:
  - SECURITY-CRITICAL
  - DATA-CORRUPTION
  force_agent_review_failure_family_prefixes:
  - GOVERNANCE
  force_agent_review_axes:
  - test_integrity
  suppress_note_only_reviewer_escalation: true
  note_only_auto_fix: false
L2_if_any:
- reviewer_confidence_low_or_medium
- agent_review_finding
- major_candidate
- moderate_reversibility
- service_or_larger_blast_radius
- soft_large_diff
- test_integrity_finding
- supply_chain_change
ADVERSARIAL_if_any:
- l1_l2_disagreement
- novel_failure_family
- deterministic_reviewer_conflict
- blocker_candidate
- security_surface_high_or_critical
- protected_path_adversarial_floor
- unexplained_spec_change_after_pr_open
- reviewer_policy_tampering
HUMAN_if_any:
- protected_path_human_floor
- security_surface_high_or_critical
- governance_change
- hard_reversibility
- data_sensitivity_pii_or_secret
- availability_critical
- destructive_migration
- public_contract_break
- payment_or_irreversible_external_side_effect
- ruleset_or_codeowners_change
- adversarial_unresolved
random_audit:
  enabled: true
  l1_final_sample_percent: 5
  l2_final_sample_percent: 10
