schema_version: '2.7'
self_protection_repository_names:
- geni2kim-ai/PR-with-codediff-finder

governance_paths:
- .github/workflows/**
- .github/actions/**
- .github/copilot-instructions.md
- .github/instructions/**
- CODEOWNERS
- .github/CODEOWNERS
- docs/CODEOWNERS
- AGENTS.md
- CLAUDE.md
- GEMINI.md
- REVIEW.md
- CODING_STANDARDS.md
- profiles/**
- policy/**
- schemas/**
- docs/REVIEW_POLICY.md
- docs/REVIEW_AUTHORITY_LADDER.md
- docs/OPERATIONS.md
- docs/RETRO_GOVERNANCE.md

human_floor_paths:
- .github/workflows/**
- .github/actions/**
- CODEOWNERS
- .github/CODEOWNERS
- docs/CODEOWNERS
- migrations/**
- db/migrations/**
- infra/**
- deploy/**
- payments/**
- billing/**
- api/public/**
- schemas/public/**

adversarial_floor_paths:
- auth/**
- security/**
- crypto/**
- payments/**
- billing/**
- migrations/**
- db/migrations/**
- .github/workflows/**
- .github/actions/**
- profiles/**
- policy/**
- schemas/**

# Applied only when the reviewed repository is this harness (repository name or
# sentinel files match). This avoids forcing HUMAN review on every application's
# ordinary tests/tools directory while preventing the harness from weakening its
# own gate implementation under L1.
self_protection_paths:
- /tools/**
- /tests/**
- /vendor/**
- /requirements.txt
- /requirements*.txt
- /PACKAGE_VERSION
- /MANIFEST.sha256
- /.gitignore

self_protection_adversarial_paths:
- /tools/**
- /tests/**
- /vendor/**
- /requirements.txt
- /requirements*.txt

supply_chain_files:
- package.json
- package-lock.json
- pnpm-lock.yaml
- yarn.lock
- requirements*.txt
- pyproject.toml
- poetry.lock
- Pipfile.lock
- Cargo.toml
- Cargo.lock
- go.mod
- go.sum
- Dockerfile*
